services:
  postgres:
    image: postgres:16
    container_name: 360retail-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "12345"
      POSTGRES_DB: 360RetailDB
    command: >
      postgres
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=256MB
      -c max_connections=50
    # ports:  # Không expose DB ra ngoài - chỉ truy cập qua Docker network
    #   - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 360retail-network

  redis:
    image: redis:7-alpine
    container_name: 360retail-redis
    # ports:  # Không expose Redis ra ngoài
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - 360retail-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: 360retail-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@360retail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - 360retail-network

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/API/Dockerfile
    container_name: 360retail-identity-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=360RetailDB;Username=postgres;Password=12345;Maximum Pool Size=10
      - ServiceUrls__HrService=http://hr-api:8080
      - ServiceUrls__SaasService=http://saas-api:8080
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET}
      - InternalApi__Key=${INTERNAL_API_KEY:-360retail-internal-secret-key-2026}
      - JwtSettings__Key=${JWT_SECRET_KEY:-THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_360RETAIL}
      # Resend (Email Service)
      - Resend__ApiKey=${RESEND_API_KEY}
      - Resend__FromEmail=${RESEND_FROM_EMAIL}
      # Redis Cache
      - ConnectionStrings__Redis=redis:6379
      # CORS Origins (comma-separated)
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5297:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 360retail-network

  saas-api:
    build:
      context: .
      dockerfile: src/Services/Saas/API/Dockerfile
    container_name: 360retail-saas-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__SaasDb=Host=postgres;Port=5432;Database=360RetailDB;Username=postgres;Password=12345;Maximum Pool Size=10
      - ServiceUrls__IdentityService=http://identity-api:8080
      - InternalApi__Key=${INTERNAL_API_KEY:-360retail-internal-secret-key-2026}
      - JwtSettings__Key=${JWT_SECRET_KEY:-THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_360RETAIL}
      # Resend (Email Service)
      - Resend__ApiKey=${RESEND_API_KEY}
      - Resend__FromEmail=${RESEND_FROM_EMAIL}
      # SePay (Bank Transfer Payment)
      - SePay__MerchantId=${SEPAY_MERCHANT_ID}
      - SePay__SecretKey=${SEPAY_SECRET_KEY}
      - SePay__BankName=${SEPAY_BANK_NAME:-MBBank}
      - SePay__AccountNumber=${SEPAY_ACCOUNT_NUMBER}
      - SePay__AccountName=${SEPAY_ACCOUNT_NAME}
      # Groq AI (Chatbot - Llama 3.3 70B)
      - Groq__ApiKey=${GROQ_API_KEY}
      # VNPay (Payment Gateway)
      - VNPay__TmnCode=${VNPAY_TMN_CODE}
      - VNPay__HashSecret=${VNPAY_HASH_SECRET}
      # CORS Origins (comma-separated)
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5031:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 360retail-network

  sales-api:
    build:
      context: .
      dockerfile: src/Services/Sales/API/Dockerfile
    container_name: 360retail-sales-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=360RetailDB;Username=postgres;Password=12345;Maximum Pool Size=10
      # Cloudinary Configuration - Set these in .env file
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - ServiceUrls__CrmService=http://crm-api:8080
      - InternalApi__Key=${INTERNAL_API_KEY:-360retail-internal-secret-key-2026}
      - JwtSettings__Key=${JWT_SECRET_KEY:-THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_360RETAIL}
      # Redis Cache
      - ConnectionStrings__Redis=redis:6379
      # Resend (Email Service)
      - Resend__ApiKey=${RESEND_API_KEY}
      - Resend__FromEmail=${RESEND_FROM_EMAIL}
      # CORS Origins (comma-separated)
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5091:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 360retail-network

  hr-api:
    build:
      context: .
      dockerfile: src/Services/HR/360Retail.Services.HR.API/Dockerfile
    container_name: 360retail-hr-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=360RetailDB;Username=postgres;Password=12345;Maximum Pool Size=10
      - ServiceUrls__IdentityService=http://identity-api:8080
      - InternalApi__Key=${INTERNAL_API_KEY:-360retail-internal-secret-key-2026}
      - JwtSettings__Key=${JWT_SECRET_KEY:-THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_360RETAIL}
      - JwtSettings__Issuer=360Retail_Identity
      - JwtSettings__Audience=360Retail_Users
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      # Resend (Email Service)
      - Resend__ApiKey=${RESEND_API_KEY}
      - Resend__FromEmail=${RESEND_FROM_EMAIL}
      # CORS Origins (comma-separated)
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5280:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 360retail-network

  crm-api:
    build:
      context: .
      dockerfile: src/Services/CRM/API/Dockerfile
    container_name: 360retail-crm-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=360RetailDB;Username=postgres;Password=12345;Maximum Pool Size=10
      - JwtSettings__Key=${JWT_SECRET_KEY:-THIS_IS_A_VERY_LONG_AND_SECURE_SECRET_KEY_360RETAIL}
      - JwtSettings__Issuer=360Retail_Identity
      - JwtSettings__Audience=360Retail_Users
      - InternalApi__Key=${INTERNAL_API_KEY:-360retail-internal-secret-key-2026}
      # CORS Origins (comma-separated)
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5169:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - 360retail-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: 360retail-api-gateway
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - CorsOrigins=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:4200}
    ports:
      - "5001:8080"
    depends_on:
      - identity-api
      - saas-api
      - sales-api
      - hr-api
      - crm-api
    networks:
      - 360retail-network

networks:
  360retail-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
